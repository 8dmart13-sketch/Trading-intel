name: Copy-trade backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to test"
        default: "30"
      top:
        description: "How many top traders to copy"
        default: "20"
      category:
        description: "Leaderboard category (OVERALL, SPORTS, POLITICS, CRYPTO)"
        default: "OVERALL"
      wallets:
        description: "Optional: specific wallets, comma-separated (skips leaderboard)"
        default: ""
      fee_rate:
        description: "Assumed fee per trade (0.01 = 1%)"
        default: "0.01"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write the backtest code
        run: |
          mkdir -p backtest results
          cat > backtest/sim.py <<'PYEOF'
          """Pure simulation logic for the copy-trade backtest (no network calls).
          
          A "signal" is one decision by a followed trader to buy into an outcome.
          We copy each signal with a fixed dollar stake, entering `delay` seconds
          after the trader did, at whatever the market price was by then.
          """
          
          from __future__ import annotations
          
          from dataclasses import dataclass, field
          from typing import Callable, Optional
          
          MERGE_WINDOW = 600  # buys of the same outcome within 10 min = one signal
          
          
          @dataclass
          class Signal:
              wallet: str
              asset: str          # outcome token id
              condition_id: str   # market id
              outcome_index: int
              title: str
              outcome: str
              ts: int             # time of the trader's first fill
              trader_price: float # trader's average fill price
              trader_usd: float
          
          
          @dataclass
          class Exit:
              wallet: str
              asset: str
              ts: int
          
          
          def build_signals(trades: list[dict]) -> tuple[list[Signal], list[Exit]]:
              """Collapse raw fills into buy signals and sell (exit) events."""
              signals: list[Signal] = []
              exits: list[Exit] = []
              open_sig: dict[tuple[str, str], Signal] = {}
              for t in sorted(trades, key=lambda x: int(x["timestamp"])):
                  key = (t["wallet"], t["asset"])
                  ts = int(t["timestamp"])
                  price = float(t["price"])
                  size = float(t["size"])
                  if t["side"].upper() == "BUY":
                      s = open_sig.get(key)
                      if s and ts - s.ts <= MERGE_WINDOW:
                          total = s.trader_usd + price * size
                          shares = s.trader_usd / s.trader_price + size
                          s.trader_usd = total
                          s.trader_price = total / shares if shares else s.trader_price
                      else:
                          s = Signal(t["wallet"], t["asset"], t.get("conditionId", ""),
                                     int(t.get("outcomeIndex", 0) or 0), t.get("title", ""),
                                     t.get("outcome", ""), ts, price, price * size)
                          open_sig[key] = s
                          signals.append(s)
                  else:
                      exits.append(Exit(t["wallet"], t["asset"], ts))
              return signals, exits
          
          
          @dataclass
          class Result:
              label: str
              trades: list[dict] = field(default_factory=list)
              skipped_no_price: int = 0
              skipped_extreme: int = 0
          
              def summary(self) -> dict:
                  n = len(self.trades)
                  staked = sum(t["stake"] for t in self.trades)
                  pnl = sum(t["pnl"] for t in self.trades)
                  resolved = [t for t in self.trades if t["status"] == "resolved"]
                  wins = sum(1 for t in resolved if t["pnl"] > 0)
                  slips = [t["slippage_c"] for t in self.trades if t["slippage_c"] is not None]
                  # worst peak-to-trough on cumulative P&L, in time order
                  cum = peak = dd = 0.0
                  for t in sorted(self.trades, key=lambda x: x["ts"]):
                      cum += t["pnl"]
                      peak = max(peak, cum)
                      dd = min(dd, cum - peak)
                  return {
                      "label": self.label,
                      "copied_trades": n,
                      "total_staked": round(staked, 2),
                      "pnl": round(pnl, 2),
                      "roi_pct": round(100 * pnl / staked, 2) if staked else 0.0,
                      "resolved": len(resolved),
                      "still_open": n - len(resolved),
                      "win_rate_pct": round(100 * wins / len(resolved), 1) if resolved else None,
                      "avg_slippage_cents": round(sum(slips) / len(slips), 2) if slips else None,
                      "max_drawdown": round(dd, 2),
                      "skipped_no_price": self.skipped_no_price,
                      "skipped_extreme_price": self.skipped_extreme,
                  }
          
          
          PriceFn = Callable[[str, int], Optional[float]]
          SettleFn = Callable[[str, int], tuple[Optional[float], str]]  # (payout per share, status)
          
          
          def simulate(signals: list[Signal], exits: list[Exit], *, delay: int,
                       stake: float, fee_rate: float, price_at: PriceFn,
                       settle: SettleFn, follow_exits: bool, label: str,
                       use_trader_price: bool = False) -> Result:
              """Copy every signal with `stake` dollars.
          
              use_trader_price=True gives the "leader's own result" baseline:
              the trader's fill price, no delay, no fees.
              follow_exits=True sells our copy the first time the trader sells that
              outcome after our entry; otherwise we hold until the market settles.
              """
              res = Result(label)
              exits_by_key: dict[tuple[str, str], list[int]] = {}
              for e in exits:
                  exits_by_key.setdefault((e.wallet, e.asset), []).append(e.ts)
              for v in exits_by_key.values():
                  v.sort()
          
              for s in signals:
                  if use_trader_price:
                      entry, fee = s.trader_price, 0.0
                  else:
                      entry = price_at(s.asset, s.ts + delay)
                      fee = stake * fee_rate
                  if entry is None:
                      res.skipped_no_price += 1
                      continue
                  if entry <= 0.01 or entry >= 0.99:
                      res.skipped_extreme += 1
                      continue
                  shares = stake / entry
                  exit_value: Optional[float] = None
                  status = ""
                  if follow_exits:
                      later = [ts for ts in exits_by_key.get((s.wallet, s.asset), []) if ts > s.ts]
                      if later:
                          xp = price_at(s.asset, later[0] + (0 if use_trader_price else delay))
                          if xp is not None:
                              exit_value = shares * xp
                              if not use_trader_price:
                                  exit_value -= exit_value * fee_rate
                              status = "resolved"  # closed out = realized
                  if exit_value is None:
                      payout, status = settle(s.condition_id, s.outcome_index)
                      if payout is None:
                          res.skipped_no_price += 1
                          continue
                      exit_value = shares * payout
                  pnl = exit_value - stake - fee
                  res.trades.append({
                      "wallet": s.wallet, "title": s.title, "outcome": s.outcome,
                      "ts": s.ts, "trader_price": round(s.trader_price, 4),
                      "our_price": round(entry, 4),
                      "slippage_c": None if use_trader_price else round(100 * (entry - s.trader_price), 2),
                      "stake": stake, "pnl": round(pnl, 4), "status": status,
                  })
              return res
          PYEOF
          cat > backtest/run.py <<'PYEOF'
          """Polymarket copy-trading backtest.
          
          Pulls the top traders from Polymarket's public leaderboard (or wallets you
          give it), replays every buy they made in the last N days, and works out
          what you would have made copying them after a delay, after fees.
          
          Read-only. No account, keys or money involved.
          
          Usage:
            python backtest/run.py --days 30 --top 20 --category OVERALL
            python backtest/run.py --wallets 0xabc...,0xdef...
          """
          
          from __future__ import annotations
          
          import argparse
          import json
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime, timezone
          from pathlib import Path
          from threading import Lock
          
          sys.path.insert(0, str(Path(__file__).parent))
          from sim import build_signals, simulate  # noqa: E402
          
          DATA = "https://data-api.polymarket.com"
          GAMMA = "https://gamma-api.polymarket.com"
          CLOB = "https://clob.polymarket.com"
          UA = {"User-Agent": "trading-intel-backtest/1.0", "Accept": "application/json"}
          
          ROOT = Path(__file__).resolve().parent.parent
          OUT = ROOT / "results"
          
          
          # ---------------------------------------------------------------- HTTP
          
          def get(base: str, path: str, params: dict | None = None, tries: int = 5):
              url = f"{base}{path}"
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              for attempt in range(tries):
                  try:
                      req = urllib.request.Request(url, headers=UA)
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return json.loads(r.read().decode())
                  except urllib.error.HTTPError as e:
                      if e.code in (429, 500, 502, 503, 504) and attempt < tries - 1:
                          time.sleep(2 ** attempt)
                          continue
                      body = e.read().decode(errors="replace")[:200]
                      print(f"  HTTP {e.code} {url} :: {body}", file=sys.stderr)
                      return None
                  except (urllib.error.URLError, TimeoutError) as e:
                      if attempt < tries - 1:
                          time.sleep(2 ** attempt)
                          continue
                      print(f"  network error {url} :: {e}", file=sys.stderr)
                      return None
          
          
          # ---------------------------------------------------------------- data
          
          def leaderboard(category: str, period: str, top: int) -> list[dict]:
              rows = get(DATA, "/v1/leaderboard", {
                  "category": category, "timePeriod": period,
                  "orderBy": "PNL", "limit": top,
              }) or []
              if isinstance(rows, dict):  # tolerate {"data": [...]} shapes
                  rows = rows.get("data") or rows.get("leaderboard") or []
              out = []
              for r in rows[:top]:
                  w = r.get("proxyWallet") or r.get("address") or r.get("user")
                  if w:
                      out.append({"wallet": w.lower(), "name": r.get("userName") or r.get("name") or "",
                                  "lb_pnl": r.get("pnl"), "lb_volume": r.get("vol")})
              return out
          
          
          def trades_for(wallet: str, since: int, cap: int) -> list[dict]:
              out, offset = [], 0
              while len(out) < cap:
                  page = get(DATA, "/trades", {"user": wallet, "limit": 500,
                                               "offset": offset, "takerOnly": "false"})
                  if not page:
                      break
                  for t in page:
                      if int(t.get("timestamp", 0)) < since:
                          return out
                      t["wallet"] = wallet
                      out.append(t)
                  if len(page) < 500:
                      break
                  offset += 500
              return out[:cap]
          
          
          class Prices:
              """Market price of an outcome token at (or just after) a moment in time."""
          
              def __init__(self):
                  self.cache: dict[tuple[str, int], float | None] = {}
                  self.lock = Lock()
          
              def __call__(self, token: str, ts: int):
                  key = (token, ts // 60)
                  with self.lock:
                      if key in self.cache:
                          return self.cache[key]
                  data = get(CLOB, "/prices-history", {"market": token, "startTs": ts - 60,
                                                       "endTs": ts + 1800, "fidelity": 1})
                  hist = (data or {}).get("history") or []
                  p = None
                  for pt in sorted(hist, key=lambda x: x["t"]):
                      if pt["t"] >= ts:
                          p = float(pt["p"])
                          break
                  if p is None and hist:
                      p = float(sorted(hist, key=lambda x: x["t"])[-1]["p"])
                  with self.lock:
                      self.cache[key] = p
                  return p
          
          
          class Settlements:
              """Payout per share for an outcome: 1/0 once settled, else current price."""
          
              def __init__(self):
                  self.cache: dict[str, dict | None] = {}
          
              def load(self, condition_ids: set[str]):
                  ids = [c for c in condition_ids if c and c not in self.cache]
                  for i in range(0, len(ids), 20):
                      chunk = ids[i:i + 20]
                      rows = get(GAMMA, "/markets", [("condition_ids", c) for c in chunk]
                                 + [("limit", 50)]) if chunk else []
                      # urlencode needs a dict or list of pairs
                      for m in rows or []:
                          self.cache[(m.get("conditionId") or "").lower()] = m
                      for c in chunk:
                          self.cache.setdefault(c.lower(), None)
          
              def __call__(self, condition_id: str, outcome_index: int):
                  m = self.cache.get((condition_id or "").lower())
                  if not m:
                      return None, "unknown"
                  try:
                      prices = m.get("outcomePrices")
                      prices = json.loads(prices) if isinstance(prices, str) else prices
                      p = float(prices[outcome_index])
                  except (TypeError, ValueError, IndexError, json.JSONDecodeError):
                      return None, "unknown"
                  if m.get("closed") and (p >= 0.99 or p <= 0.01):
                      return (1.0 if p >= 0.99 else 0.0), "resolved"
                  return p, "open"
          
          
          # ---------------------------------------------------------------- report
          
          def fmt_money(x):
              return f"-${abs(x):,.2f}" if x < 0 else f"${x:,.2f}"
          
          
          def write_report(meta, summaries, per_wallet, sample):
              lines = [f"# Copy-trading backtest — {meta['run_at']}", ""]
              base = next((s for s in summaries if s["label"].startswith("Leader")), None)
              key = next((s for s in summaries if s["label"] == meta["headline"]), None)
              if key:
                  verdict = "made money" if key["pnl"] > 0 else "lost money"
                  lines += ["## Bottom line", "",
                            f"Copying {meta['n_wallets']} top traders for the last {meta['days']} days, "
                            f"entering **{meta['headline_delay_min']} min** after them and holding to the end, "
                            f"**{verdict}**: {fmt_money(key['pnl'])} on {fmt_money(key['total_staked'])} staked "
                            f"(**{key['roi_pct']}%**) across {key['copied_trades']} copied trades.", ""]
                  if base:
                      lines += [f"For comparison, the traders themselves (their own prices, no fees) got "
                                f"{base['roi_pct']}% on the same trades. The gap is what delay + fees cost you.", ""]
              lines += ["## All scenarios", "",
                        "| Scenario | Trades | Staked | P&L | ROI | Win rate | Avg price paid vs trader | Worst drawdown |",
                        "|---|---|---|---|---|---|---|---|"]
              for s in summaries:
                  slip = "" if s["avg_slippage_cents"] is None else f"{s['avg_slippage_cents']:+.2f}¢"
                  wr = "" if s["win_rate_pct"] is None else f"{s['win_rate_pct']}%"
                  lines.append(f"| {s['label']} | {s['copied_trades']} | {fmt_money(s['total_staked'])} | "
                               f"{fmt_money(s['pnl'])} | {s['roi_pct']}% | {wr} | {slip} | {fmt_money(s['max_drawdown'])} |")
              lines += ["", f"## By trader ({meta['headline']})", "",
                        "| Trader | Wallet | Copied trades | P&L | ROI |", "|---|---|---|---|---|"]
              for w in per_wallet:
                  lines.append(f"| {w['name'] or '—'} | `{w['wallet'][:10]}…` | {w['n']} | "
                               f"{fmt_money(w['pnl'])} | {w['roi_pct']}% |")
              lines += ["", "## Read this before trusting the numbers", "",
                        "- **These are best-case results.** Traders were picked *because* they did well recently, "
                        "then tested on that same period. Real future results will likely be worse.",
                        f"- Fees are an assumption: {meta['fee_rate']*100:.1f}% of each trade, charged on entry and on exit. "
                        "Change `--fee-rate` to test others.",
                        "- Prices are historical market prices, not the exact ask you could have bought at. "
                        "Real fills, especially in thin markets, would usually be a bit worse.",
                        "- 'Still open' trades are valued at today's price, not a final result.",
                        f"- Each copied trade uses a flat {fmt_money(meta['stake'])} stake regardless of how much the trader bet.",
                        "- Only covers Polymarket (international). Kalshi and the cheaper-platform comparison come next.",
                        "", f"Raw data: `results/backtest.json`. Settings: `{json.dumps(meta['args'])}`"]
              if sample:
                  lines += ["", "## Sample of copied trades", "",
                            "| Market | Pick | Trader paid | We paid | P&L | Status |", "|---|---|---|---|---|---|"]
                  for t in sample:
                      lines.append(f"| {t['title'][:60]} | {t['outcome']} | {t['trader_price']:.2f} | "
                                   f"{t['our_price']:.2f} | {fmt_money(t['pnl'])} | {t['status']} |")
              (OUT / "report.md").write_text("\n".join(lines) + "\n")
          
          
          # ---------------------------------------------------------------- main
          
          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("--days", type=int, default=30)
              ap.add_argument("--top", type=int, default=20)
              ap.add_argument("--category", default="OVERALL", help="OVERALL, SPORTS, POLITICS, CRYPTO, ...")
              ap.add_argument("--period", default="MONTH", help="leaderboard window: DAY, WEEK, MONTH, ALL")
              ap.add_argument("--wallets", default="", help="comma-separated wallets; overrides leaderboard")
              ap.add_argument("--delays", default="60,300,900", help="seconds after trader to copy")
              ap.add_argument("--stake", type=float, default=10.0)
              ap.add_argument("--fee-rate", type=float, default=0.01)
              ap.add_argument("--max-trades-per-wallet", type=int, default=1500)
              ap.add_argument("--max-signals-per-wallet", type=int, default=150)
              a = ap.parse_args()
          
              OUT.mkdir(exist_ok=True)
              since = int(time.time()) - a.days * 86400
              delays = [int(d) for d in a.delays.split(",") if d.strip()]
              headline_delay = 300 if 300 in delays else delays[0]
          
              if a.wallets.strip():
                  traders = [{"wallet": w.strip().lower(), "name": "", "lb_pnl": None, "lb_volume": None}
                             for w in a.wallets.split(",") if w.strip()]
              else:
                  print(f"Leaderboard: {a.category} / {a.period} / top {a.top}")
                  traders = leaderboard(a.category, a.period, a.top)
              if not traders:
                  sys.exit("No traders found (leaderboard empty or blocked). Check the log above.")
              names = {t["wallet"]: t["name"] for t in traders}
          
              all_signals, all_exits = [], []
              for t in traders:
                  raw = trades_for(t["wallet"], since, a.max_trades_per_wallet)
                  sigs, exits = build_signals(raw)
                  sigs = sorted(sigs, key=lambda s: s.ts)[-a.max_signals_per_wallet:]
                  print(f"  {t['name'] or t['wallet'][:10]}: {len(raw)} fills -> {len(sigs)} buy signals")
                  all_signals += sigs
                  all_exits += exits
              if not all_signals:
                  sys.exit("No buy trades found in the window.")
          
              settle = Settlements()
              settle.load({s.condition_id for s in all_signals})
              prices = Prices()
          
              # warm the price cache in parallel (the slow part)
              needed = {(s.asset, s.ts + d) for s in all_signals for d in delays}
              by_key = {}
              for e in all_exits:
                  by_key.setdefault((e.wallet, e.asset), []).append(e.ts)
              for s in all_signals:
                  later = sorted(ts for ts in by_key.get((s.wallet, s.asset), []) if ts > s.ts)
                  if later:
                      needed |= {(s.asset, later[0] + d) for d in delays + [0]}
              print(f"Fetching {len(needed)} historical prices…")
              with ThreadPoolExecutor(max_workers=8) as ex:
                  list(ex.map(lambda k: prices(*k), needed))
          
              common = dict(stake=a.stake, fee_rate=a.fee_rate, price_at=prices, settle=settle)
              runs = [simulate(all_signals, all_exits, delay=0, follow_exits=False,
                               label="Leader's own result (their price, no fees)",
                               use_trader_price=True, **common)]
              for d in delays:
                  m = d // 60 if d >= 60 else d
                  unit = "min" if d >= 60 else "sec"
                  runs.append(simulate(all_signals, all_exits, delay=d, follow_exits=False,
                                       label=f"Copy {m} {unit} later, hold to end", **common))
                  runs.append(simulate(all_signals, all_exits, delay=d, follow_exits=True,
                                       label=f"Copy {m} {unit} later, sell when they sell", **common))
              summaries = [r.summary() for r in runs]
              headline_label = f"Copy {headline_delay // 60} min later, hold to end"
              head = next(r for r in runs if r.label == headline_label)
          
              per = {}
              for t in head.trades:
                  p = per.setdefault(t["wallet"], {"wallet": t["wallet"], "name": names.get(t["wallet"], ""),
                                                   "n": 0, "pnl": 0.0, "staked": 0.0})
                  p["n"] += 1
                  p["pnl"] += t["pnl"]
                  p["staked"] += t["stake"]
              per_wallet = sorted(per.values(), key=lambda x: -x["pnl"])
              for p in per_wallet:
                  p["pnl"] = round(p["pnl"], 2)
                  p["roi_pct"] = round(100 * p["pnl"] / p["staked"], 2) if p["staked"] else 0
          
              meta = {"run_at": datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC"),
                      "days": a.days, "n_wallets": len(traders), "stake": a.stake,
                      "fee_rate": a.fee_rate, "headline": headline_label,
                      "headline_delay_min": headline_delay // 60, "args": vars(a)}
              sample = sorted(head.trades, key=lambda t: -t["ts"])[:25]
              (OUT / "backtest.json").write_text(json.dumps(
                  {"meta": meta, "traders": traders, "summaries": summaries,
                   "per_wallet": per_wallet, "trades": head.trades}, indent=1))
              write_report(meta, summaries, per_wallet, sample)
              print((OUT / "report.md").read_text())
          
          
          if __name__ == "__main__":
              main()
          PYEOF
          cat > backtest/test_sim.py <<'PYEOF'
          """Offline checks of the P&L math. Run: python backtest/test_sim.py"""
          import sys
          from pathlib import Path
          
          sys.path.insert(0, str(Path(__file__).parent))
          from sim import build_signals, simulate  # noqa: E402
          
          trades = [
              # trader buys YES on market A in two fills 2 min apart -> one signal
              {"wallet": "w1", "side": "BUY", "asset": "A", "conditionId": "cA", "outcomeIndex": 0,
               "price": 0.40, "size": 100, "timestamp": 1000, "title": "Market A", "outcome": "Yes"},
              {"wallet": "w1", "side": "BUY", "asset": "A", "conditionId": "cA", "outcomeIndex": 0,
               "price": 0.50, "size": 100, "timestamp": 1120, "title": "Market A", "outcome": "Yes"},
              # buys market B, later sells
              {"wallet": "w1", "side": "BUY", "asset": "B", "conditionId": "cB", "outcomeIndex": 1,
               "price": 0.60, "size": 50, "timestamp": 2000, "title": "Market B", "outcome": "No"},
              {"wallet": "w1", "side": "SELL", "asset": "B", "conditionId": "cB", "outcomeIndex": 1,
               "price": 0.80, "size": 50, "timestamp": 5000, "title": "Market B", "outcome": "No"},
          ]
          sigs, exits = build_signals(trades)
          assert len(sigs) == 2 and len(exits) == 1
          assert abs(sigs[0].trader_price - 0.45) < 1e-9, sigs[0].trader_price
          
          price = {("A", 1300): 0.50, ("B", 2300): 0.65, ("B", 5300): 0.75, ("B", 5000): 0.80}
          price_at = lambda tok, ts: price.get((tok, ts))
          settle = lambda cid, idx: {"cA": (1.0, "resolved"), "cB": (0.0, "resolved")}[cid]
          
          r = simulate(sigs, exits, delay=300, stake=10, fee_rate=0.01, price_at=price_at,
                       settle=settle, follow_exits=False, label="hold")
          s = r.summary()
          # A: 10/0.5=20 shares *1 -10 -0.1 = 9.9 ; B: 10/0.65 *0 -10 -0.1 = -10.1
          assert abs(s["pnl"] - (-0.2)) < 1e-6, s
          assert s["win_rate_pct"] == 50.0
          
          r = simulate(sigs, exits, delay=300, stake=10, fee_rate=0.01, price_at=price_at,
                       settle=settle, follow_exits=True, label="follow")
          s = r.summary()
          b_exit = (10 / 0.65) * 0.75
          b_pnl = b_exit - b_exit * 0.01 - 10 - 0.1
          assert abs(s["pnl"] - round(9.9 + b_pnl, 2)) < 0.01, (s, 9.9 + b_pnl)
          
          r = simulate(sigs, exits, delay=0, stake=10, fee_rate=0.01, price_at=price_at,
                       settle=settle, follow_exits=False, label="leader", use_trader_price=True)
          s = r.summary()
          assert abs(s["pnl"] - (10 / 0.45 - 10 - 10)) < 0.01, s
          print("all checks passed")
          PYEOF
      - name: Check the math
        run: python backtest/test_sim.py
      - name: Run backtest
        run: |
          python backtest/run.py \
            --days "${{ inputs.days }}" \
            --top "${{ inputs.top }}" \
            --category "${{ inputs.category }}" \
            --wallets "${{ inputs.wallets }}" \
            --fee-rate "${{ inputs.fee_rate }}"
      - name: Save results to the repo
        run: |
          git config user.name "backtest-bot"
          git config user.email "backtest-bot@users.noreply.github.com"
          git add backtest/ results/
          git commit -m "Backtest results $(date -u +%Y-%m-%d_%H%M)" || echo "nothing to commit"
          git push
